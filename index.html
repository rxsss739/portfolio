let currentLang = 'en';

function formatDuration(startDate, labels, endDate = new Date()){
  const start = new Date(`${startDate}T00:00:00`);
  let months = (endDate.getFullYear() - start.getFullYear()) * 12;
  months += endDate.getMonth() - start.getMonth();
  if(endDate.getDate() < start.getDate()) months -= 1;
  months = Math.max(0, months);

  const years = Math.floor(months / 12);
  const remainingMonths = months % 12;
  const duration = [];
  if(years) duration.push(`${years} ${years === 1 ? labels.year : labels.years}`);
  if(remainingMonths) duration.push(`${remainingMonths} ${remainingMonths === 1 ? labels.month : labels.months}`);
  return duration.join(', ') || labels.lessThanMonth;
}

async function loadDiscordStatus(labels){
  const members = document.getElementById('discord-members');
  const online = document.getElementById('discord-online');
  const status = document.getElementById('discord-status');
  const join = document.getElementById('discord-join');
  if(!members) return;

  if(DISCORD_INVITE_URL){
    join.href = DISCORD_INVITE_URL;
    join.hidden = false;
  } else {
    join.hidden = true;
  }

  if(!DISCORD_GUILD_ID){
    status.textContent = labels.discordMissing;
    return;
  }

  status.textContent = labels.discordLoading;
  try {
    const res = await fetch(`https://discord.com/api/v10/invites/${DISCORD_INVITE_URL.split('/').pop()}?with_counts=true`);
    if(!res.ok) throw new Error('unavailable');
    const data = await res.json();
    members.textContent = data.approximate_member_count ?? '--';
    online.textContent = data.approximate_presence_count ?? '--';
    status.textContent = data.guild?.name || labels.discordTitle;
  } catch(err) {
    status.textContent = labels.discordError;
  }
}

function projectDiscordBlock(p, labels){
  if(!p.discord) return '';
  return `
    <div class="discord-panel">
      <div class="discord-head">
        <span>${labels.discordTitle}</span>
        <p class="discord-status" id="discord-status">${labels.discordLoading}</p>
      </div>
      <div class="discord-stats">
        <div><span>${labels.discordMembers}</span><strong id="discord-members">--</strong></div>
        <div><span>${labels.discordOnline}</span><strong id="discord-online">--</strong></div>
      </div>
      <a class="text-link" id="discord-join" href="#" target="_blank" rel="noopener" hidden>${labels.joinDiscord}</a>
    </div>
  `;
}

function render(lang){

  document.getElementById('label-events').textContent = c.labels.events;
  document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} ${c.name}`;

  /* projects: vertical timeline */
  document.getElementById('projects').innerHTML = c.projects.map((p, i) => `
    <div class="tl-row">
      <div class="tl-rail">
        <span class="tl-node${p.current ? ' is-live' : ''}"></span>
        <span class="tl-line"></span>
      </div>
      <details class="tl-content">
        <summary>
          <span class="tl-date">${p.date}</span>
          <span class="tl-name">${p.name}</span>
        </summary>
        <div class="tl-body">
          <p>${p.details || p.desc}</p>
          <div class="tag-row">${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="tl-links">
            ${p.link ? `<a class="text-link" href="${p.link}" target="_blank" rel="noopener">${c.labels.viewProject}</a>` : ''}
            ${p.ucpLink ? `<a class="text-link" href="${p.ucpLink}" target="_blank" rel="noopener">${c.labels.openPanel}</a>` : ''}
          </div>
          ${projectDiscordBlock(p, c.labels)}
        </div>
      </details>
    </div>
  `).join('');

  if(c.projects.some(p => p.discord)){
    document.querySelectorAll('#projects details').forEach((el, i) => {
      if(c.projects[i].discord){
        el.addEventListener('toggle', () => { if(el.open) loadDiscordStatus(c.labels); }, { once: true });
      }
    });
  }

  /* trophies: ledger rows */
  document.getElementById('trophies').innerHTML = [...c.trophies].reverse().map(t => `
    <div class="ledger-row">
      <span class="ledger-year">${t.year}</span>
      <span class="ledger-main">${t.name}</span>
      <span class="ledger-value${t.highlight ? ' is-highlight' : ''}">${t.result}</span>
    </div>
  `).join('');

  /* companies: ledger rows */
  document.getElementById('companies').innerHTML = [...c.companies].reverse().map(co => `
    <div class="ledger-row">
      <span class="ledger-year${co.current ? ' is-live' : ''}">${co.period}</span>
      <span class="ledger-main">
        <span class="ledger-title">${co.name}</span>
        <span class="ledger-sub">${co.role}</span>
      </span>
      <span class="ledger-value">${formatDuration(co.startDate, c.labels, co.endDate ? new Date(`${co.endDate}T00:00:00`) : new Date())}</span>
    </div>
  `).join('');

  /* events: accordion list */
  document.getElementById('events').innerHTML = [...c.events].reverse().map(e => {
    const head = `<span class="event-name">${e.name}</span><span class="event-date">${e.date}</span>`;
    if(!e.details) return `<li class="event-item event-plain">${head}</li>`;
    return `
      <li class="event-item">
        <details>
          <summary>${head}<span class="event-chevron" aria-hidden="true"></span></summary>
          <p class="event-details">${e.details}</p>
        </details>
      </li>
    `;
  }).join('');
}

function setLang(lang){
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-et').classList.toggle('active', lang === 'et');
  render(lang);
}
